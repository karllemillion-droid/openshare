{% extends "base.html" %}
{% block title %}OpenShare · Connexion Espace Sécurisé{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 px-2 animate-fade-in">
  
  <div class="bg-slate-900/40 border border-slate-800/80 rounded-3xl p-8 backdrop-blur-xl shadow-2xl relative overflow-hidden">
    
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
    
    <div class="text-center mb-8 relative z-10">
      <div class="inline-flex items-center justify-center h-12 w-12 rounded-xl bg-blue-600/10 border border-blue-500/20 text-blue-400 text-xl mb-4 shadow-inner select-none">
        🔑
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Ravi de vous revoir</h1>
      <p class="text-xs text-slate-400 mt-1">Connectez-vous pour accéder à votre espace de stockage résilient.</p>
    </div>

    <form id="login-form" action="{{ url_for('auth.login') }}" method="POST" class="space-y-5 relative z-10">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Nom d'utilisateur</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm">👤</span>
          <input type="text" name="username" required autocomplete="username"
                 class="w-full bg-slate-950/60 border border-slate-800 text-slate-200 placeholder-slate-600 text-sm rounded-xl pl-10 pr-4 py-3 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-all"
                 placeholder="Ex: Karlomick">
        </div>
      </div>

      <div class="space-y-1.5">
        <div class="flex justify-between items-center">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Mot de passe</label>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm">🔒</span>
          <input type="password" name="password" id="password" required autocomplete="current-password"
                 class="w-full bg-slate-950/60 border border-slate-800 text-slate-200 placeholder-slate-600 text-sm rounded-xl pl-10 pr-4 py-3 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-all"
                 placeholder="••••••••">
        </div>
      </div>

      <button type="submit" 
              class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 px-4 shadow-lg shadow-blue-600/20 active:scale-[0.99] transition-all mt-2">
        Entrer dans le Nuage
      </button>
    </form>

    <div class="border-t border-slate-800/60 mt-6 pt-5 text-center relative z-10">
      <p class="text-xs text-slate-400">
        Nouveau sur la plateforme ? 
        <a href="{{ url_for('auth.register') }}" class="text-blue-400 font-semibold hover:underline ml-1">Créer un compte de stockage</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
